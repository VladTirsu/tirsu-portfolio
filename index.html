<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="Vlad Tîrșu — graphic design, 3D visualization, motion, and video production. Explore a multidisciplinary portfolio, CV, and contact details." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vlad Tîrșu — Design, 3D & Motion</title>
  </head>
  <body>
    <svg class="outline-definitions" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <!-- Outline the rendered silhouette so overlapping font paths leave no seams. -->
        <filter id="name-outline-filter" x="-3%" y="-5%" width="106%" height="110%" color-interpolation-filters="sRGB">
          <feMorphology in="SourceAlpha" operator="dilate" radius="1" result="expanded" />
          <feComposite in="expanded" in2="SourceAlpha" operator="out" result="outline" />
          <feFlood flood-color="#d8d8ce" result="strokeColor" />
          <feComposite in="strokeColor" in2="outline" operator="in" />
        </filter>
      </defs>
    </svg>
    <header id="header" class="site-header"></header>
    <main id="main" tabindex="-1"></main>
    <footer id="footer" class="site-footer"></footer>
    <noscript>This portfolio needs JavaScript. You can also find Vlad's work at <a href="https://www.behance.net/vlad_t18">Behance</a>.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
